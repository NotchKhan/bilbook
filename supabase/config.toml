project_id = "bilbook"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100
[db]
port = 54322
major_version = 17
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback", "http://127.0.0.1:3000/auth/callback?reset=1"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m"
[storage]
enabled = true
file_size_limit = "3MiB"
